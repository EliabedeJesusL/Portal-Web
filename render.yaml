# Blueprint do Render: https://render.com/docs/blueprint-spec
# Dois serviços independentes — é assim que o G1 original já roda em produção:
# a API não serve o Portal, cada um é publicado separadamente.
services:
  - type: web
    name: recreio-arcade-api
    runtime: node
    plan: free
    region: virginia
    rootDir: api
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Connection string do Postgres (Supabase em produção). Ver api/docs/supabase.md.
      - key: DATABASE_URL
        sync: false
      # Opcional, mas recomendado: sem ele o limite de submissões do GitHub é
      # 60/hora, compartilhado com outros serviços do Render.
      - key: GITHUB_TOKEN
        sync: false
      # Troque pela URL pública do Portal depois de criado (ex.: https://recreio-arcade-portal.onrender.com).
      - key: CORS_ORIGINS
        value: http://localhost:5173

  - type: static
    name: recreio-arcade-portal
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Aponte para a URL pública do serviço recreio-arcade-api acima.
      - key: VITE_API_BASE_URL
        value: https://recreio-arcade-api.onrender.com/api
    routes:
      # SPA: qualquer rota que não seja um arquivo real cai no index.html.
      - type: rewrite
        source: /*
        destination: /index.html
