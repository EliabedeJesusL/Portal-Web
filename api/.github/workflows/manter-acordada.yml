name: Mantém a API acordada

# No plano free, o Render desliga o serviço após 15 minutos sem acesso, e a
# primeira requisição depois disso leva de 30 a 60 s. Este ping evita isso.
# O GitHub pode atrasar execuções agendadas; por isso o intervalo é curto.
# Agendamentos só rodam a partir da branch padrão do repositório.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://plataforma-gestao-api.onrender.com/health
